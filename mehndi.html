<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hassan and Minha's Mehndi</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .main-video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 1;
      pointer-events: none;
      transition: opacity 1.5s ease;
      z-index: 2;
    }

    .overlay.hide {
      opacity: 0;
    }
  </style>
</head>
<body>

  <audio id="bgmusic" src="bgmusic1.mp3" loop></audio>

  <!-- Main video -->
  <video id="mainVideo" class="main-video" preload="auto" playsinline>
    <source src="video1.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- White overlay for fade-in/out -->
  <div id="fadeOverlay" class="overlay"></div>

  <script>
    const overlay = document.getElementById("fadeOverlay");
    const video = document.getElementById("mainVideo");
    const music = document.getElementById("bgmusic");

    // Fade in from white
    window.addEventListener("load", () => {
      setTimeout(() => {
        overlay.classList.add("hide");
      }, 200);
    });

    // Wait until video can play smoothly
    video.addEventListener("canplaythrough", () => {
      video.play().then(() => {
        music.play().catch(() => {
          console.log("Music autoplay blocked until user interaction.");
        });
      }).catch(err => {
        console.log("Autoplay blocked, waiting for click...");
        document.body.addEventListener("click", () => {
          video.play();
          music.play();
        }, { once: true });
      });
    });

    // When video finishes, fade out and redirect
    video.addEventListener("ended", () => {
      overlay.classList.remove("hide");
      setTimeout(() => {
        window.location.href = "rsvpm.html";
      }, 1500);
    });
  </script>

</body>
</html>
